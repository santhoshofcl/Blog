<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="assets/head-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santhoshofcl</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7311910532350997"
     crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

</head>
<body class="text-black">
    <canvas id="canvas"></canvas>

    <nav class="fixed top-0 left-0 right-0 bg-transparent bg-opacity-50 z-50 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <a href="#" class="text-2xl font-bold text-white">Santhoshofcl</a>
    
                <!-- Hamburger Menu Button -->
                <button id="menu-btn" class="block md:hidden text-white focus:outline-none">
                    <svg id="menu-icon" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                    <svg id="close-icon" class="w-8 h-8 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
    
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="text-lg font-bold text-white">Main Menu</a>
                </div>
            </div>
    
            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden inset-0 bg-white bg-opacity-95 p-6 flex flex-col items-center justify-center">
                <a href="index.html" class="text-lg font-bold text-black">Main Menu</a>
            </div>
        </div>
    </nav>
    <div id="loading-overlay">
        <div class="loader"></div>
        
    </div>
    <div id="main-content">
    <section class="quiz-section">
     <br>
     <br>
     <br>
     <br>   
    <h2>TNPSC EXAM Quiz</h2>
    <label>Part:</label>
    <select id="part-filter"></select>

    <label>Unit:</label>
    <select id="unit-filter"></select>

    <label>Topic:</label>
    <select id="topic-filter"></select>

    <button class="quiz-btn" onclick="fetchQuestions()">Start Quiz</button>

    
    <div id="quiz-container"></div>
    <div id="quiz-result"></div>
    <button class="quiz-btn" id="next-button" onclick="nextQuestion()" style="display: none;">Next</button>

    <button class="quiz-btn" id="submit-button" onclick="submitQuiz()" style="display: none;">Submit</button>

</section>
</div>    

<script src="assets/script.js"></script>
    <script>
        AOS.init({offset:0});
      </script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuIcon = document.getElementById('menu-icon');
        const closeIcon = document.getElementById('close-icon');
    
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        });
    </script>
    
    
</body>
</html>
