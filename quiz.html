<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="assets/head-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santhoshofcl</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7311910532350997"
     crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

</head>
<body class="text-black">
    <canvas id="canvas"></canvas>

    <nav class="fixed top-0 left-0 right-0 bg-transparent bg-opacity-50 z-50 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <a href="#" class="text-2xl font-bold text-white">Santhoshofcl</a>
    
                <!-- Desktop Menu -->
                <a href="index.html" class="text-2xl font-bold text-back"> Main Menu </a>
        </div>
    </nav>
    <div id="loading-overlay">
        <div class="loader"></div>
        
    </div>
    <div id="main-content">
    <section class="quiz-section">
     <br>
     <br>
     <br>
     <br>   
    <h2>TNPSC EXAM Quiz</h2>
    <label>Part:</label>
    <select id="part-filter"></select>

    <label>Unit:</label>
    <select id="unit-filter"></select>

    <label>Topic:</label>
    <select id="topic-filter"></select>

    <button class="quiz-btn" onclick="fetchQuestions()">Start Quiz</button>

    
    <div id="quiz-container"></div>
    <div id="quiz-result"></div>
    <button class="quiz-btn" id="next-button" onclick="nextQuestion()" style="display: none;">Next</button>

    <button class="quiz-btn" id="submit-button" onclick="submitQuiz()" style="display: none;">Submit</button>

</section>
</div>    

<script src="assets/script.js"></script>
    <script>
        AOS.init({offset:0});
      </script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    
    
</body>
</html>
