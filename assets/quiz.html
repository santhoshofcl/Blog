<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="assets/head-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <title>Santhoshofcl.info</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo" data-aos="zoom-in" data-aos-duration="1000">
                <span>Santhoshofcl</span>
            </div>
            <div class="links">
                <div class="link" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100"><a href="index.html">Home</a></div>
                <div class="link" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100"><a href="quiz.html">Quiz</a></div>
                <div class="link" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200"><a href="#">About</a></div>
                <div class="link contact-btn" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="600"><a href="#">Contact Us</a></div>
            </div>
            <i class="fa-solid fa-bars hamburg" onclick="hamburg()"></i>
        </div>
        <div class="dropdown">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="quiz.html">Quiz</a>
                <a href="">About</a>
                <a href="">Contact Us</a>
                <i class="fa-solid fa-xmark cancel" onclick="cancel()"></i>
            </div>
        </div>
    </nav>
    <div id="loading-overlay">
        <div class="loader"></div>
        
    </div>
    <div id="main-content">
    <section class="quiz-section">
        
    <h2>TNPSC EXAM Quiz</h2>
    <label>Part:</label>
    <select id="part-filter"></select>

    <label>Unit:</label>
    <select id="unit-filter"></select>

    <label>Topic:</label>
    <select id="topic-filter"></select>

    <button onclick="fetchQuestions()">Start Quiz</button>

    
    <div id="quiz-container"></div>
    <div id="quiz-result"></div>
    <button id="next-button" onclick="nextQuestion()" style="display: none;">Next</button>

    <button id="submit-button" onclick="submitQuiz()" style="display: none;">Submit</button>

</section>
</div>    

    <script src="assets/script.js"></script>
    <script>
        AOS.init({offset:0});
      </script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
      <script>
          function hamburg(){
              const navbar = document.querySelector(".dropdown")
              navbar.style.transform = "translateY(0px)"
          }
          function cancel(){
              const navbar = document.querySelector(".dropdown")
              navbar.style.transform = "translateY(-500px)"
          }
      </script>
</body>
</html>
